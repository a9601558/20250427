<!DOCTYPE html>
<html>
<head>
    <title>Test ID Fix</title>
</head>
<body>
    <h1>测试ID修复逻辑</h1>
    <div id="results"></div>

    <script>
        // 复制QuizPage中的逻辑
        const validateQuestionSetId = (questionSetId) => {
            if (!questionSetId) return false;
            
            const uuidRegex = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
            
            if (uuidRegex.test(questionSetId)) {
                return true;
            }
            
            if (questionSetId.includes('_')) {
                const parts = questionSetId.split('_');
                return parts.some(part => uuidRegex.test(part));
            }
            
            return false;
        };

        const extractValidUuid = (questionSetId) => {
            if (!questionSetId) return null;
            
            const uuidRegex = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
            
            if (uuidRegex.test(questionSetId)) {
                return questionSetId;
            }
            
            if (questionSetId.includes('_')) {
                const parts = questionSetId.split('_');
                
                for (const part of parts) {
                    if (uuidRegex.test(part)) {
                        console.log('从错误格式ID中提取有效UUID:', questionSetId, '->', part);
                        return part;
                    }
                }
            }
            
            console.error('无法从异常ID中提取有效UUID:', questionSetId);
            return null;
        };

        // 测试用例
        const testCases = [
            'a2a9cd96-22a1-43b4-8f5e-735920a41662', // 标准UUID
            'a2a9cd96-22a1-43b4-8f5e-735920a41662_63efed58-2735-4d04-967a-ef2421a457ee', // 错误格式
            'invalid-id', // 无效ID
            '', // 空字符串
            null, // null
            undefined // undefined
        ];

        const results = document.getElementById('results');
        
        testCases.forEach((testCase, index) => {
            const isValid = validateQuestionSetId(testCase);
            const extracted = extractValidUuid(testCase);
            
            const result = document.createElement('div');
            result.innerHTML = `
                <h3>测试 ${index + 1}: ${testCase || 'null/undefined'}</h3>
                <p>验证结果: ${isValid ? '✅ 有效' : '❌ 无效'}</p>
                <p>提取结果: ${extracted || '无法提取'}</p>
                <hr>
            `;
            results.appendChild(result);
        });
    </script>
</body>
</html>
