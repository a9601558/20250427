<svg width="640" height="480" viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="640" height="480" fill="#f8f9fa"/>
  
  <!-- MonTopi Logo -->
  <g transform="translate(130, 270)">
    <!-- Main MonTopi Text -->
    <text x="0" y="0" font-family="Inter, -apple-system, sans-serif" font-size="120" font-weight="700" fill="#1e3a8a">MonTopi</text>
    
    <!-- Cat character with glasses and headphones -->
    <g transform="translate(420, -80)">
      <!-- Cat face -->
      <circle cx="0" cy="0" r="45" fill="#f59e0b"/>
      
      <!-- Cat ears -->
      <polygon points="-30,-35 -15,-55 -5,-35" fill="#f59e0b"/>
      <polygon points="5,-35 15,-55 30,-35" fill="#f59e0b"/>
      <polygon points="-25,-40 -18,-50 -12,-40" fill="#ea580c"/>
      <polygon points="12,-40 18,-50 25,-40" fill="#ea580c"/>
      
      <!-- Glasses -->
      <circle cx="-15" cy="-5" r="12" fill="none" stroke="#1e3a8a" stroke-width="3"/>
      <circle cx="15" cy="-5" r="12" fill="none" stroke="#1e3a8a" stroke-width="3"/>
      <line x1="3" y1="-5" x2="-3" y2="-5" stroke="#1e3a8a" stroke-width="3"/>
      
      <!-- Eyes -->
      <circle cx="-15" cy="-5" r="6" fill="#1e3a8a"/>
      <circle cx="15" cy="-5" r="6" fill="#1e3a8a"/>
      <circle cx="-13" cy="-7" r="2" fill="white"/>
      <circle cx="17" cy="-7" r="2" fill="white"/>
      
      <!-- Nose -->
      <polygon points="0,5 -3,12 3,12" fill="#ea580c"/>
      
      <!-- Mouth -->
      <path d="M -8,18 Q 0,25 8,18" fill="none" stroke="#1e3a8a" stroke-width="2"/>
      
      <!-- Headphones -->
      <path d="M -45,-20 Q -55,-10 -55,0 Q -55,10 -45,20" fill="none" stroke="#dc2626" stroke-width="6"/>
      <path d="M 45,-20 Q 55,-10 55,0 Q 55,10 45,20" fill="none" stroke="#dc2626" stroke-width="6"/>
      <circle cx="-45" cy="0" r="8" fill="#dc2626"/>
      <circle cx="45" cy="0" r="8" fill="#dc2626"/>
      
      <!-- Whiskers -->
      <line x1="-35" y1="5" x2="-50" y2="0" stroke="#1e3a8a" stroke-width="2"/>
      <line x1="-35" y1="15" x2="-50" y2="18" stroke="#1e3a8a" stroke-width="2"/>
      <line x1="35" y1="5" x2="50" y2="0" stroke="#1e3a8a" stroke-width="2"/>
      <line x1="35" y1="15" x2="50" y2="18" stroke="#1e3a8a" stroke-width="2"/>
    </g>
  </g>
</svg>