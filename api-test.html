<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API测试页面</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        button { margin: 5px; padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin: 10px 0; padding: 10px; background: #f8f9fa; border-radius: 3px; white-space: pre-wrap; }
        .error { background: #f8d7da; color: #721c24; }
        .success { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <h1>题库管理API测试页面</h1>
    
    <div class="section">
        <h2>测试API连接</h2>
        <button onclick="testConnection()">测试基础连接</button>
        <button onclick="testQuestionSets()">测试获取题库列表</button>
        <button onclick="testQuestionCount()">测试获取题目数量</button>
        <div id="connection-result" class="result"></div>
    </div>

    <div class="section">
        <h2>题库列表</h2>
        <button onclick="loadQuestionSets()">加载题库列表</button>
        <div id="question-sets-result" class="result"></div>
    </div>

    <div class="section">
        <h2>题目数量测试</h2>
        <input type="text" id="questionSetId" placeholder="输入题库ID" style="margin: 5px; padding: 8px;">
        <button onclick="testSpecificCount()">测试特定题库题目数量</button>
        <div id="count-result" class="result"></div>
    </div>

    <script>
        // 从localStorage获取token (如果有的话)
        const getAuthHeaders = () => {
            const token = localStorage.getItem('token');
            return token ? { 'Authorization': `Bearer ${token}` } : {};
        };

        // 显示结果
        const showResult = (elementId, data, isError = false) => {
            const element = document.getElementById(elementId);
            element.textContent = JSON.stringify(data, null, 2);
            element.className = `result ${isError ? 'error' : 'success'}`;
        };

        // 测试基础连接
        const testConnection = async () => {
            try {
                const response = await fetch('/api/');
                const data = await response.text();
                showResult('connection-result', { 
                    status: response.status, 
                    statusText: response.statusText,
                    response: data 
                });
            } catch (error) {
                showResult('connection-result', { 
                    error: error.message,
                    details: '无法连接到后端服务器'
                }, true);
            }
        };

        // 测试获取题库列表
        const testQuestionSets = async () => {
            try {
                const response = await fetch('/api/question-sets', {
                    headers: getAuthHeaders()
                });
                const data = await response.json();
                showResult('connection-result', { 
                    status: response.status,
                    success: data.success,
                    dataLength: data.data ? data.data.length : 0,
                    message: data.message,
                    firstItem: data.data && data.data[0] ? data.data[0] : null
                });
            } catch (error) {
                showResult('connection-result', { 
                    error: error.message 
                }, true);
            }
        };

        // 测试获取题目数量
        const testQuestionCount = async () => {
            try {
                // 先获取题库列表，然后测试第一个题库的题目数量
                const setsResponse = await fetch('/api/question-sets', {
                    headers: getAuthHeaders()
                });
                const setsData = await setsResponse.json();
                
                if (setsData.success && setsData.data && setsData.data.length > 0) {
                    const firstSetId = setsData.data[0].id;
                    const countResponse = await fetch(`/api/questions/count/${firstSetId}`, {
                        headers: getAuthHeaders()
                    });
                    const countData = await countResponse.json();
                    
                    showResult('connection-result', {
                        questionSetId: firstSetId,
                        questionSetTitle: setsData.data[0].title,
                        status: countResponse.status,
                        success: countData.success,
                        count: countData.count,
                        message: countData.message
                    });
                } else {
                    showResult('connection-result', { 
                        error: '没有找到题库数据' 
                    }, true);
                }
            } catch (error) {
                showResult('connection-result', { 
                    error: error.message 
                }, true);
            }
        };

        // 加载题库列表
        const loadQuestionSets = async () => {
            try {
                const response = await fetch('/api/question-sets', {
                    headers: getAuthHeaders()
                });
                const data = await response.json();
                
                if (data.success && data.data) {
                    const simplified = data.data.map(set => ({
                        id: set.id,
                        title: set.title,
                        category: set.category,
                        questionCount: set.questionCount || 'N/A'
                    }));
                    showResult('question-sets-result', simplified);
                } else {
                    showResult('question-sets-result', data, true);
                }
            } catch (error) {
                showResult('question-sets-result', { 
                    error: error.message 
                }, true);
            }
        };

        // 测试特定题库的题目数量
        const testSpecificCount = async () => {
            const questionSetId = document.getElementById('questionSetId').value;
            if (!questionSetId) {
                showResult('count-result', { 
                    error: '请输入题库ID' 
                }, true);
                return;
            }

            try {
                const response = await fetch(`/api/questions/count/${questionSetId}`, {
                    headers: getAuthHeaders()
                });
                const data = await response.json();
                
                showResult('count-result', {
                    questionSetId: questionSetId,
                    status: response.status,
                    success: data.success,
                    count: data.count,
                    message: data.message
                });
            } catch (error) {
                showResult('count-result', { 
                    error: error.message 
                }, true);
            }
        };

        // 页面加载时自动测试连接
        window.onload = () => {
            testConnection();
        };
    </script>
</body>
</html>
