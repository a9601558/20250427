<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン処理中...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 400px;
            width: 90%;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        h1 {
            margin: 0 0 10px;
            font-size: 24px;
            font-weight: 600;
        }
        
        p {
            margin: 0;
            opacity: 0.9;
            font-size: 14px;
        }
        
        .success {
            color: #4ade80;
        }
        
        .error {
            color: #f87171;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>ログイン処理中...</h1>
        <p>認証が完了するまでお待ちください</p>
        <p id="status"></p>
    </div>

    <script type="module">
        // OIDC 回调处理脚本
        console.log('[PopupCallback] 弹窗回调页面加载');
        
        try {
            // 检查URL中是否有认证码或错误信息
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const error = urlParams.get('error');
            const errorDescription = urlParams.get('error_description');
            
            const statusEl = document.getElementById('status');
            
            if (error) {
                console.error('[PopupCallback] 认证错误:', error, errorDescription);
                statusEl.textContent = `エラー: ${errorDescription || error}`;
                statusEl.className = 'error';
                
                // 通知父窗口认证失败
                if (window.opener) {
                    window.opener.postMessage({
                        type: 'OIDC_POPUP_ERROR',
                        error: error,
                        errorDescription: errorDescription
                    }, '*');
                }
                
                // 延迟关闭窗口
                setTimeout(() => {
                    window.close();
                }, 3000);
                
            } else if (code) {
                console.log('[PopupCallback] 认证成功，获得授权码');
                statusEl.textContent = '認証成功！';
                statusEl.className = 'success';
                
                // 通知父窗口认证成功
                if (window.opener) {
                    window.opener.postMessage({
                        type: 'OIDC_POPUP_SUCCESS',
                        code: code,
                        url: window.location.href
                    }, '*');
                }
                
                // 延迟关闭窗口，让用户看到成功消息
                setTimeout(() => {
                    window.close();
                }, 1500);
                
            } else {
                console.log('[PopupCallback] 等待认证回调...');
                statusEl.textContent = '認証コールバックを待機中...';
                
                // 如果没有参数，可能是正在重定向
                setTimeout(() => {
                    if (!window.location.search) {
                        statusEl.textContent = 'リダイレクト中...';
                    }
                }, 2000);
            }
            
        } catch (err) {
            console.error('[PopupCallback] 处理回调时出错:', err);
            const statusEl = document.getElementById('status');
            statusEl.textContent = '処理中にエラーが発生しました';
            statusEl.className = 'error';
            
            // 延迟关闭窗口
            setTimeout(() => {
                window.close();
            }, 3000);
        }
    </script>
</body>
</html>
